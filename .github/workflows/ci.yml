name: CI

# Pull requests, and pushes to main. A push to a PR's branch is covered by its pull_request run, so each PR update
# runs CI once, not twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Balance simulations
        run: npm test

      # Fails if any element matchup at level 20 leaves 40–60% (1500 seeded fights each, so the result is repeatable)
      - name: Element balance gate
        run: npm run test:balance-gate

      - name: UI smoke test
        run: npm run test:ui showcase

      # 1920x1080 layout in both languages: worst-case cards, fonts blocked, OBS mode, demo controls, contrast, result labels
      - name: Layout test
        run: npm run test:layout

      # Battle log cards, turn animation, ultimates, countdown (both modes) and result card, both languages
      - name: Fight view test
        run: npm run test:fightview

      # Upload even when a test fails: the screenshots are how you see what went wrong
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: tests/screenshots/
          if-no-files-found: warn
